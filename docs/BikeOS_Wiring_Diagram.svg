<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>

  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0A0E14">BikeOS - ESP32 Wiring Diagram (Phase 4)</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#555">Matches GPIO assignments in sensors.cpp / controls.cpp / power.cpp - do not change pins here without updating the firmware.</text>

  <!-- Legend -->
  <g font-size="12" fill="#333">
    <line x1="60" y1="80" x2="95" y2="80" stroke="#d62728" stroke-width="3"/>
    <text x="100" y="84">Power (3.3V)</text>
    <line x1="220" y1="80" x2="255" y2="80" stroke="#222222" stroke-width="3"/>
    <text x="260" y="84">GND</text>
    <line x1="340" y1="80" x2="375" y2="80" stroke="#1f77b4" stroke-width="3"/>
    <text x="380" y="84">Digital GPIO</text>
    <line x1="520" y1="80" x2="555" y2="80" stroke="#2ca02c" stroke-width="3"/>
    <text x="560" y="84">I2C (SDA/SCL)</text>
    <line x1="700" y1="80" x2="735" y2="80" stroke="#9467bd" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="740" y="84">Battery/MOSFET load path (NOT through ESP32)</text>
  </g>

  <!-- ESP32 center box -->
  <rect x="490" y="130" width="220" height="640" rx="10" fill="#12161F" stroke="#000" stroke-width="2"/>
  <text x="600" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ESP32 DevKit</text>
  <text x="600" y="185" text-anchor="middle" font-size="11" fill="#9AA5B1">(30/38-pin devkit - adjust</text>
  <text x="600" y="200" text-anchor="middle" font-size="11" fill="#9AA5B1">pin positions to your board)</text>

  <!-- Left pin stubs -->
  <!-- 3V3 -->
  <line x1="440" y1="240" x2="490" y2="240" stroke="#d62728" stroke-width="3"/>
  <text x="435" y="244" text-anchor="end" font-size="12" fill="#000">3V3</text>
  <!-- GND -->
  <line x1="440" y1="280" x2="490" y2="280" stroke="#222" stroke-width="3"/>
  <text x="435" y="284" text-anchor="end" font-size="12" fill="#000">GND</text>
  <!-- SDA -->
  <line x1="440" y1="320" x2="490" y2="320" stroke="#2ca02c" stroke-width="3"/>
  <text x="435" y="324" text-anchor="end" font-size="12" fill="#000">GPIO21 (SDA)</text>
  <!-- SCL -->
  <line x1="440" y1="360" x2="490" y2="360" stroke="#2ca02c" stroke-width="3"/>
  <text x="435" y="364" text-anchor="end" font-size="12" fill="#000">GPIO22 (SCL)</text>
  <!-- GPIO4 -->
  <line x1="440" y1="420" x2="490" y2="420" stroke="#1f77b4" stroke-width="3"/>
  <text x="435" y="424" text-anchor="end" font-size="12" fill="#000">GPIO4</text>
  <!-- GPIO5 -->
  <line x1="440" y1="460" x2="490" y2="460" stroke="#1f77b4" stroke-width="3"/>
  <text x="435" y="464" text-anchor="end" font-size="12" fill="#000">GPIO5</text>
  <!-- GND (hall) -->
  <line x1="440" y1="500" x2="490" y2="500" stroke="#222" stroke-width="3"/>
  <text x="435" y="504" text-anchor="end" font-size="12" fill="#000">GND</text>

  <!-- Right pin stubs -->
  <line x1="710" y1="240" x2="760" y2="240" stroke="#1f77b4" stroke-width="3"/>
  <text x="765" y="244" font-size="12" fill="#000">GPIO13</text>
  <line x1="710" y1="280" x2="760" y2="280" stroke="#1f77b4" stroke-width="3"/>
  <text x="765" y="284" font-size="12" fill="#000">GPIO14</text>
  <line x1="710" y1="320" x2="760" y2="320" stroke="#1f77b4" stroke-width="3"/>
  <text x="765" y="324" font-size="12" fill="#000">GPIO27</text>
  <line x1="710" y1="380" x2="760" y2="380" stroke="#1f77b4" stroke-width="3"/>
  <text x="765" y="384" font-size="12" fill="#000">GPIO32</text>
  <line x1="710" y1="420" x2="760" y2="420" stroke="#1f77b4" stroke-width="3"/>
  <text x="765" y="424" font-size="12" fill="#000">GPIO33</text>
  <line x1="710" y1="460" x2="760" y2="460" stroke="#1f77b4" stroke-width="3"/>
  <text x="765" y="464" font-size="12" fill="#000">GPIO25</text>
  <line x1="710" y1="500" x2="760" y2="500" stroke="#1f77b4" stroke-width="3"/>
  <text x="765" y="504" font-size="12" fill="#000">GPIO26</text>
  <line x1="710" y1="540" x2="760" y2="540" stroke="#222" stroke-width="3"/>
  <text x="765" y="544" font-size="12" fill="#000">GND</text>

  <!-- ===================== LEFT MODULES ===================== -->

  <!-- VL53L1X -->
  <rect x="60" y="200" width="220" height="90" rx="8" fill="#eafaf1" stroke="#2ca02c" stroke-width="2"/>
  <text x="170" y="222" text-anchor="middle" font-size="13" font-weight="bold">VL53L1X (rear ToF)</text>
  <text x="170" y="240" text-anchor="middle" font-size="11">VIN -> 3.3V</text>
  <text x="170" y="255" text-anchor="middle" font-size="11">GND -> GND</text>
  <text x="170" y="270" text-anchor="middle" font-size="11">SDA -> GPIO21, SCL -> GPIO22</text>
  <line x1="280" y1="245" x2="440" y2="320" stroke="#2ca02c" stroke-width="2"/>

  <!-- INA219 -->
  <rect x="60" y="310" width="220" height="90" rx="8" fill="#eafaf1" stroke="#2ca02c" stroke-width="2"/>
  <text x="170" y="332" text-anchor="middle" font-size="13" font-weight="bold">INA219 (battery)</text>
  <text x="170" y="350" text-anchor="middle" font-size="11">VIN -> 3.3V or 5V, GND -> GND</text>
  <text x="170" y="365" text-anchor="middle" font-size="11">SDA -> GPIO21, SCL -> GPIO22</text>
  <text x="170" y="380" text-anchor="middle" font-size="10" fill="#555">(shares the I2C bus with VL53L1X)</text>
  <line x1="280" y1="355" x2="440" y2="360" stroke="#2ca02c" stroke-width="2"/>

  <!-- Wheel Hall -->
  <rect x="60" y="410" width="220" height="80" rx="8" fill="#eaf2fb" stroke="#1f77b4" stroke-width="2"/>
  <text x="170" y="432" text-anchor="middle" font-size="13" font-weight="bold">Wheel Hall Sensor</text>
  <text x="170" y="450" text-anchor="middle" font-size="11">VCC -> 3.3V, GND -> GND</text>
  <text x="170" y="465" text-anchor="middle" font-size="11">OUT -> GPIO4</text>
  <line x1="280" y1="440" x2="440" y2="420" stroke="#1f77b4" stroke-width="2"/>

  <!-- Cadence Hall -->
  <rect x="60" y="500" width="220" height="80" rx="8" fill="#eaf2fb" stroke="#1f77b4" stroke-width="2"/>
  <text x="170" y="522" text-anchor="middle" font-size="13" font-weight="bold">Cadence Hall Sensor</text>
  <text x="170" y="540" text-anchor="middle" font-size="11">VCC -> 3.3V, GND -> GND</text>
  <text x="170" y="555" text-anchor="middle" font-size="11">OUT -> GPIO5</text>
  <line x1="280" y1="530" x2="440" y2="460" stroke="#1f77b4" stroke-width="2"/>

  <!-- Magnet note -->
  <rect x="60" y="600" width="220" height="70" rx="8" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="170" y="622" text-anchor="middle" font-size="11" font-weight="bold">Magnets (not wired)</text>
  <text x="170" y="638" text-anchor="middle" font-size="10">1x on wheel spoke, aligned to</text>
  <text x="170" y="652" text-anchor="middle" font-size="10">wheel-sensor bracket at BDC</text>
  <text x="170" y="665" text-anchor="middle" font-size="10">1x on crank arm, same idea</text>

  <!-- ===================== RIGHT MODULES ===================== -->

  <!-- Front Light -->
  <rect x="920" y="200" width="220" height="90" rx="8" fill="#fdecec" stroke="#d62728" stroke-width="2"/>
  <text x="1030" y="222" text-anchor="middle" font-size="13" font-weight="bold">Front Light MOSFET</text>
  <text x="1030" y="240" text-anchor="middle" font-size="11">Gate -> GPIO13 (+ 220R series R)</text>
  <text x="1030" y="255" text-anchor="middle" font-size="11">Source -> GND, 10k pulldown Gate-GND</text>
  <text x="1030" y="270" text-anchor="middle" font-size="11">Drain -> Light(-), Light(+) -> Battery+</text>
  <line x1="920" y1="245" x2="760" y2="240" stroke="#1f77b4" stroke-width="2"/>

  <!-- Rear Light -->
  <rect x="920" y="310" width="220" height="90" rx="8" fill="#fdecec" stroke="#d62728" stroke-width="2"/>
  <text x="1030" y="332" text-anchor="middle" font-size="13" font-weight="bold">Rear Light MOSFET</text>
  <text x="1030" y="350" text-anchor="middle" font-size="11">Gate -> GPIO14 (+ 220R series R)</text>
  <text x="1030" y="365" text-anchor="middle" font-size="11">Source -> GND, 10k pulldown Gate-GND</text>
  <text x="1030" y="380" text-anchor="middle" font-size="11">Drain -> Light(-), Light(+) -> Battery+</text>
  <line x1="920" y1="355" x2="760" y2="280" stroke="#1f77b4" stroke-width="2"/>

  <!-- Body Light -->
  <rect x="920" y="420" width="220" height="90" rx="8" fill="#fdecec" stroke="#d62728" stroke-width="2"/>
  <text x="1030" y="442" text-anchor="middle" font-size="13" font-weight="bold">Body Light MOSFET</text>
  <text x="1030" y="460" text-anchor="middle" font-size="11">Gate -> GPIO27 (+ 220R series R)</text>
  <text x="1030" y="475" text-anchor="middle" font-size="11">Source -> GND, 10k pulldown Gate-GND</text>
  <text x="1030" y="490" text-anchor="middle" font-size="11">Drain -> Light(-), Light(+) -> Battery+</text>
  <line x1="920" y1="465" x2="760" y2="320" stroke="#1f77b4" stroke-width="2"/>

  <!-- Buttons -->
  <rect x="920" y="530" width="220" height="60" rx="8" fill="#eef2ff" stroke="#5555cc" stroke-width="2"/>
  <text x="1030" y="550" text-anchor="middle" font-size="12" font-weight="bold">Light Button</text>
  <text x="1030" y="566" text-anchor="middle" font-size="10">GPIO32 -&gt; button -&gt; GND (INPUT_PULLUP)</text>
  <line x1="920" y1="560" x2="760" y2="380" stroke="#1f77b4" stroke-width="2"/>

  <rect x="920" y="600" width="220" height="60" rx="8" fill="#eef2ff" stroke="#5555cc" stroke-width="2"/>
  <text x="1030" y="620" text-anchor="middle" font-size="12" font-weight="bold">Mode Button</text>
  <text x="1030" y="636" text-anchor="middle" font-size="10">GPIO33 -&gt; button -&gt; GND (INPUT_PULLUP)</text>
  <line x1="920" y1="630" x2="760" y2="420" stroke="#1f77b4" stroke-width="2"/>

  <rect x="920" y="670" width="220" height="60" rx="8" fill="#eef2ff" stroke="#5555cc" stroke-width="2"/>
  <text x="1030" y="690" text-anchor="middle" font-size="12" font-weight="bold">Gear Up Button</text>
  <text x="1030" y="706" text-anchor="middle" font-size="10">GPIO25 -&gt; button -&gt; GND (INPUT_PULLUP)</text>
  <line x1="920" y1="700" x2="760" y2="460" stroke="#1f77b4" stroke-width="2"/>

  <rect x="920" y="740" width="220" height="60" rx="8" fill="#eef2ff" stroke="#5555cc" stroke-width="2"/>
  <text x="1030" y="760" text-anchor="middle" font-size="12" font-weight="bold">Gear Down Button</text>
  <text x="1030" y="776" text-anchor="middle" font-size="10">GPIO26 -&gt; button -&gt; GND (INPUT_PULLUP)</text>
  <line x1="920" y1="770" x2="760" y2="500" stroke="#1f77b4" stroke-width="2"/>

  <!-- Battery block -->
  <rect x="480" y="800" width="240" height="70" rx="8" fill="#f3eaff" stroke="#9467bd" stroke-width="2"/>
  <text x="600" y="822" text-anchor="middle" font-size="13" font-weight="bold">Battery (via TP4056 + protection)</text>
  <text x="600" y="840" text-anchor="middle" font-size="11">Battery+ / Battery- feed the 3 MOSFET drains/lights directly</text>
  <text x="600" y="855" text-anchor="middle" font-size="11">and the ESP32's VIN/5V (through a buck regulator if needed)</text>

  <text x="600" y="895" text-anchor="middle" font-size="11" fill="#777">Full pin reference table + assembly notes: BikeOS_Wiring_Guide.md</text>
</svg>
