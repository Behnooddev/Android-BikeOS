# BikeOS Gradle properties

# AndroidX is required (Room, Compose, Hilt, etc. all assume it) - without
# this, AAPT/compile fails as soon as any AndroidX artifact resolves.
android.useAndroidX=true
android.enableJetifier=true

# Standard perf/behavior defaults
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
kotlin.code.style=official
